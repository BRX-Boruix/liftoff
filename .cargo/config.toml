# 测试串行执行。
#
# **为什么**：`boot` 的测试替身共享**进程级全局状态** —— `entry.rs` 里有七组
# `AtomicUsize` 计数器（`MAP_CALLS` / `ACTIVATE_CALLS` / `ENTER_CALLS` / …），
# `diag.rs` 与 `entry.rs` 还各有一个全局 `SINK`（因为 `Platform::write_byte` 是
# **静态方法**，替身没法把状态放在自己身上）。
#
# 而 `cargo test` **默认多线程并行**跑同一二进制里的测试。共享全局 + 并行 =
# 两类真实故障，本会话都观测到了：
#   * 断言读到别的测试的计数 → **偶发 `test=101`**（重跑即过）；
#   * `SINK` 的 `&raw mut` 竞态 → **偶发 `0xC0000005` 访问违例**。
#
# 串行化是**正确**的：这些测试本来就共享全局，并行执行是错的。代价可忽略
# （全套 < 1 秒）。
#
# **后续（更好的修法）**：把计数器改成替身**自身**的 `Cell`（`activate(&self)` 也能
# 通过 `Cell` 做内部可变），只把无法避免的 `SINK` 留给锁。届时可去掉这一行。
[env]
RUST_TEST_THREADS = "1"
